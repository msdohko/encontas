name: Aviso diário (notificações)
on:
  schedule:
    - cron: '7 * * * *'    # de hora em hora; cada aparelho recebe 1x por dia no horário que escolheu no app
  workflow_dispatch:        # botão "Run workflow" para testar na hora
permissions:
  contents: read
jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - run: node scripts/notificar.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
